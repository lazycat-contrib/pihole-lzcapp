params:
  - id: password
    type: secret
    name: "Web Password"
    description: "Password for the Pi-hole web administration interface"
    default_value: "$random(len=20)"
    optional: false
  - id: timezone
    type: string
    name: "Timezone"
    description: "IANA timezone name. Common values: Asia/Shanghai, Asia/Hong_Kong, Asia/Tokyo, Asia/Singapore, Europe/London, Europe/Berlin, America/New_York, America/Los_Angeles"
    default_value: "Asia/Shanghai"
    optional: false
locales:
