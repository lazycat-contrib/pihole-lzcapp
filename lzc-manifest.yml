application:
  subdomain: pihole
  background_task: false
  multi_instance: false
  upstreams:
    - location: /
      backend: http://pihole:80/
  ingress:
    - protocol: udp
      publish_port: 1053
      port: 53
      service: pihole
    - protocol: tcp
      publish_port: 1053
      port: 53
      service: pihole
  injects:
    - id: pihole-password-autofill
      when:
        - /login
        - /login*
      do:
        - src: builtin://simple-inject-password
          params:
            password: "{{ .U.password }}"
            requireUser: false
            allowPasswordOnly: true
            passwordSelector: "#current-password"
            formSelector: "#loginform"
            autoSubmit: false
            retryCount: 20
            retryIntervalMs: 300

services:
  pihole:
    # docker.1ms.run/pihole/pihole:2026.07.2
    image: docker.1ms.run/pihole/pihole:2026.07.2
    binds:
      - /lzcapp/var/etc-pihole:/etc/pihole
    environment:
      - TZ={{ .U.timezone }}
      - FTLCONF_webserver_api_password={{ .U.password }}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:80/admin/ >/dev/null || exit 1
      start_period: 190s
      timeout: 10s
      interval: 30s
      retries: 3
usage: |
  Open the application to administer Pi-hole. LazyCat reserves port 53, so DNS is exposed on TCP and UDP port 1053 instead. Configure DNS clients that support a custom port to use the LazyCat host address with port 1053. DHCP is not exposed.
